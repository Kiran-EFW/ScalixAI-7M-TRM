# Multimodal training config combining puzzle and text data

defaults:
  - arch: text_trm  # Use text-focused architecture as default
  - _self_

hydra:
  output_subdir: null

# Data paths - mix of puzzle and text data
data_paths:
  - 'data/multimodal/multimodal_training_data.json'  # Gemini-generated text data
  # Add puzzle datasets as needed:
  # - 'data/arc-aug-1000'

data_paths_test: []

evaluators:
  - name: arc@ARC  # Keep ARC evaluation if puzzle data is included

# Hyperparams - Training
global_batch_size: 768

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Puzzle embedding training (if puzzle data is included)
puzzle_emb_lr: 1e-2

seed: 0
min_eval_interval: 0 # when to start the eval

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate
freeze_weights: False # If True, freeze weights and only learn the embeddings

# Text-specific configurations
max_seq_len: 2048
tokenizer_name: "microsoft/DialoGPT-small"  # Can be changed to other tokenizers
modalities: ["coding", "reasoning", "agentic_browsing", "conversation"]
